<!doctype html>
<html lang="en" class="auth-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/login.css" />
    <title>Set Password — FacultyLink</title>
  </head>
  <body class="auth-html">
    <div class="auth-page auth-page--compact">
      <main class="auth-form-panel">
        <div class="login-card">
          <div class="login-card__logo"><div data-fl-logo data-logo-mode="form"></div></div>
          <h2>Set Your Password</h2>
          <p class="login-card__sub" id="setup-intro">Choose a secure password for your FacultyLink account.</p>
          <form id="setup-form" class="login-form">
            <div class="fl-field" id="setup-token-field" hidden>
              <label class="fl-field__label" for="setup-token">Setup or reset code</label>
              <div class="fl-field__control">
                <input class="fl-field__input" id="setup-token" name="token" type="text" autocomplete="off" placeholder="Paste code from your email" />
              </div>
            </div>
            <div id="setup-password-fields" hidden>
              <div class="fl-field">
                <label class="fl-field__label" for="new-password">New Password</label>
                <div class="fl-field__control">
                  <input class="fl-field__input" id="new-password" name="new_password" type="password" minlength="8" required autocomplete="new-password" />
                </div>
              </div>
              <div class="fl-field">
                <label class="fl-field__label" for="confirm-password">Confirm Password</label>
                <div class="fl-field__control">
                  <input class="fl-field__input" id="confirm-password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" />
                </div>
              </div>
            </div>
            <p id="setup-error" class="login-form__error" role="alert" hidden></p>
            <p id="setup-success" class="login-form__success" role="status" hidden></p>
            <button type="submit" id="setup-submit" class="fl-btn fl-btn--primary fl-btn--full">Continue</button>
          </form>
          <p class="login-card__footer"><a class="login-link" href="login.html">Back to Sign In</a></p>
        </div>
      </main>
    </div>
    <script src="js/apiConfig.js"></script>
    <script src="js/components.js"></script>
    <script src="js/setup-password.js"></script>
  </body>
</html>
