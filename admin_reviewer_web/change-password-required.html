<!doctype html>
<html lang="en" class="auth-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/login.css" />
    <title>Change Password — FacultyLink</title>
  </head>
  <body class="auth-html">
    <div class="auth-page auth-page--compact">
      <main class="auth-form-panel">
        <div class="login-card">
          <div class="login-card__logo"><div data-fl-logo data-logo-mode="form"></div></div>
          <h2>Change Your Password</h2>
          <p class="login-card__sub" id="change-intro">For security, set a new password before continuing.</p>
          <form id="change-required-form" class="login-form">
            <div class="fl-field">
              <label class="fl-field__label" for="temp-password">Temporary Password</label>
              <div class="fl-field__control">
                <input class="fl-field__input" id="temp-password" name="temporary_password" type="password" required autocomplete="current-password" />
              </div>
            </div>
            <div class="fl-field">
              <label class="fl-field__label" for="new-password">New Password</label>
              <div class="fl-field__control">
                <input class="fl-field__input" id="new-password" name="new_password" type="password" minlength="8" required autocomplete="new-password" />
              </div>
            </div>
            <div class="fl-field">
              <label class="fl-field__label" for="confirm-password">Confirm New Password</label>
              <div class="fl-field__control">
                <input class="fl-field__input" id="confirm-password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" />
              </div>
            </div>
            <p class="login-form__notice">Use at least 8 characters with letters and numbers.</p>
            <p id="change-error" class="login-form__error" role="alert" hidden></p>
            <p id="change-success" class="login-form__success" role="status" hidden></p>
            <button type="submit" id="change-submit" class="fl-btn fl-btn--primary fl-btn--full">Update Password</button>
          </form>
        </div>
      </main>
    </div>
    <script src="js/apiConfig.js"></script>
    <script src="js/components.js"></script>
    <script src="js/change-password-required.js"></script>
  </body>
</html>
